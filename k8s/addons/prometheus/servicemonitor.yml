apiVersion: v1
kind: Service
metadata:
  name: <APP>
  namespace: <NAMESPACE>
  labels:
    app: <APP>
spec:
  selector:
    app: <APP>
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: <APP>
  namespace: <NAMESPACE>
spec:
  selector:
    matchLabels:
      app: <APP>
  endpoints:
    - port: metrics  # ports[].name of Service
      path: /metrics 
      scheme: http
      interval: 5s
      scrapeTimeout: 3s  # scrapeTimeout < interval