apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: <APP>
  namespace: <NAMESPACE>
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: <APP>
  template:
    metadata:
      labels:
        app: <APP>
    spec:
      containers:
      - name: <APP>
        image: <IMAGE>
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
  strategy:
    blueGreen:
      activeService: <APP>-active
      previewService: <APP>-preview
      autoPromotionEnabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: <APP>-active
  namespace: <NAMESPACE>
spec:
  selector:
    app: <APP>
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: <APP>-preview
  namespace: <NAMESPACE>
spec:
  selector:
    app: <APP>
  ports:
    - port: 8080
      targetPort: 8080