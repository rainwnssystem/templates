apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # Secret region
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
