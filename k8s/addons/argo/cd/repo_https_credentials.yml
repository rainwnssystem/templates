---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-secret
  namespace: argocd
spec:
  refreshInterval: 10s
  secretStoreRef:
    kind: ClusterSecretStore  # ClusterSecretStore | SecretStore
    name: secretsmanager
  target:
    name: repo-secret
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: "git"
        url: "<REPOSITORY_URL>"
        name: "product"
        project: "default"
        username: "{{ .username }}"  # data.secretKey
        password: "{{ .password }}"  # data.secretKey
  data:
    - secretKey: username
      remoteRef:
        key: wsi/codecommit  # AWS Secret Name
        property: username   # AWS Secret Key
    - secretKey: password
      remoteRef:
        key: wsi/codecommit  # AWS Secret Name
        property: password   # AWS Secret Key