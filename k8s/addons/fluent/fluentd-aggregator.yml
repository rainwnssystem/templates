apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluentd
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      serviceAccountName: fluentd-sa
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.19-debian-cloudwatch-1
          volumeMounts:
            - name: fluentd-config
              mountPath: /fluentd/etc
      volumes:
        - name: fluentd-config
          configMap:
            name: fluentd-config
---
apiVersion: v1
kind: Service
metadata:
  name: fluentd
  namespace: kube-system
spec:
  selector:
    app: fluentd
  ports:
    - port: 24224
      targetPort: 24224
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: kube-system
data:
  fluent.conf: |
    <source>
      @type forward
      bind 0.0.0.0
      port 24224
    </source>

    <match product>
      @type cloudwatch_logs
      region us-east-1
      log_group_name /wsi/app/product
      log_stream_name logs-
      use_log_stream_name_prefix true
      auto_create_stream true
    </match>

    <match customer>
      @type cloudwatch_logs
      region us-east-1
      log_group_name /wsi/app/customer
      log_stream_name logs-
      use_log_stream_name_prefix true
      auto_create_stream true
    </match>

    <match **>  # 위 match pattern에 하나도 맞지 않을 경우 여기로 옴
      @type cloudwatch_logs
      region us-east-1
      log_group_name /wsi/app/logs
      log_stream_name logs-
      use_log_stream_name_prefix true
      auto_create_stream true
    </match>