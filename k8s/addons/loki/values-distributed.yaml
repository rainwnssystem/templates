loki:
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    aws:
      region: <S3_BUCKET_REGION>
      bucketnames: <CHUNK_BUCKET_NAME>
      s3forcepathstyle: false
  ingester:
    chunk_encoding: snappy
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 672h # 28 days retention
  compactor:
    retention_enabled: true
    delete_request_store: s3
  rulerConfig:
    enable_api: true
    alertmanager_url: http://kube-prometheus-stack-alertmanager:9093

  querier:
    max_concurrent: 4

  storage:
    type: s3
    bucketNames:
      chunks: "<CHUNK_BUCKET_NAME>"
      ruler: "<RULER_BUCKET_NAME>"
      # admin: "<Insert s3 bucket name>" # Your actual S3 bucket name (loki-aws-dev-admin) - GEL customers only
    s3:
      region: <S3_BUCKET_REGION>
      # insecure: false
      # s3forcepathstyle: false

serviceAccount:
  create: false
  name: loki

deploymentMode: Distributed

ingester:
  replicas: 2
  zoneAwareReplication:
    enabled: false

querier:
  replicas: 2
  maxUnavailable: 1

queryFrontend:
  replicas: 2
  maxUnavailable: 1

queryScheduler:
  replicas: 2

distributor:
  replicas: 2
  maxUnavailable: 1
compactor:
  replicas: 1

indexGateway:
  replicas: 2
  maxUnavailable: 1

patternIngester:
  enabled: true
  replicas: 1

ruler:
  replicas: 1
  maxUnavailable: 1


# This exposes the Loki gateway so it can be written to and queried externaly
# gateway:
#   service:
#     type: LoadBalancer
#   basicAuth:
#     enabled: true
