# Since we are using basic auth, we need to pass the username and password to the canary
lokiCanary:
  extraArgs:
    - -user=loki
    - -pass=loki123
  # extraEnv:
  #   - name: LOKI_PASS
  #     valueFrom:
  #       secretKeyRef:
  #         name: canary-basic-auth
  #         key: password
  #   - name: LOKI_USER
  #     valueFrom:
  #       secretKeyRef:
  #         name: canary-basic-auth
  #         key: username

# Disable minio storage
minio:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 0