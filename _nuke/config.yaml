settings:
  IAMRole:
    IncludeServiceLinkedRoles: false
  EC2Image:
    IncludeDisabled: true
    IncludeDeprecated: true
    DisableDeregistrationProtection: true
  EC2Instance:
    DisableStopProtection: true
    DisableDeletionProtection: true
  RDSInstance:
    DisableDeletionProtection: true
  CloudFormationStack:
    DisableDeletionProtection: true
  DynamoDBTable:
    DisableDeletionProtection: true
  CognitoUserPool:
    DisableDeletionProtection: true
  DocDBCluster:
    DisableDeletionProtection: true
  DSQLCluster:
    DisableDeletionProtection: true
  EKSCluster:
    DisableDeletionProtection: true
  ELBv2:
    DisableDeletionProtection: true
  NeptuneCluster:
    DisableDeletionProtection: true
  NeptuneGraph:
    DisableDeletionProtection: true
  NeptuneInstance:
    DisableDeletionProtection: true
  PinpointPhoneNumber:
    DisableDeletionProtection: true
  QLDBLedger:
    DisableDeletionProtection: true

