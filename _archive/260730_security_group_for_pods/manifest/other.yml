apiVersion: apps/v1
kind: Deployment
metadata:
  name: other
  namespace: wsi
  labels:
    app: other
spec:
  replicas: 2
  selector:
    matchLabels:
      app: other
  strategy:
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: other
    spec:
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      tolerations:
        - key: dedicated
          value: app
          effect: NoExecute
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: other
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: dedicated
                    operator: In
                    values:
                      - app
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - other
                topologyKey: topology.kubernetes.io/zone
              weight: 100
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - other
                topologyKey: kubernetes.io/hostname
              weight: 99
      restartPolicy: Always
      containers:
        - name: other
          image: nginx
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          resources:
            requests:
              cpu: "0.1"
              memory: 100Mi
            limits:
              memory: 200Mi
          livenessProbe:
            tcpSocket:
              port: http
            timeoutSeconds: 30
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            timeoutSeconds: 5
            successThreshold: 1
            periodSeconds: 1
          ports:
            - containerPort: 80
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: other
  namespace: wsi
spec:
  selector:
    app: other
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http